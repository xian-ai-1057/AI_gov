# LLM 判讀端點設定（OpenAI 相容 chat completions 接口；資料只送此端點、不外送公有雲）。
# 僅放「非機密」預設值；api_key 一律由環境變數 GOVCHECK_LLM_API_KEY 提供，禁止寫入本檔、禁止入庫。
# 環境變數可覆寫任一鍵：GOVCHECK_LLM_ENABLED / _BASE_URL / _MODEL / _API_KEY / _TIMEOUT / _TEMPERATURE / _MAX_ITEMS / _BATCH_SIZE

enabled: false                       # 預設關閉；正式 Prompt 與核准模型都就緒後再開啟
base_url: http://localhost:11434/v1  # 本機 ollama（OpenAI 相容）；內部端點請以環境變數覆寫
model: gemma3:4b                     # 本機 ollama 範例模型；請依實際部署以 GOVCHECK_LLM_MODEL 覆寫
timeout: 60                          # 單次請求逾時（秒）
temperature: 0                       # 判讀求穩定，預設 0
max_items: 30                        # 單次審查送 LLM 的檢核項上限（安全閥；F03 實際約 20 項）
max_output_tokens: 4096              # 由應用程式控制，不採用 Prompt Manager 的 optional params
batch_size: 8                        # 舊版檢查相容值；新版依 profile 與 token budget 動態組批
prompt_provider: disabled            # disabled / file / litellm；正式 Prompt 不存放在 Git
prompt_base_url: null                # LiteLLM Prompt Management base URL
prompt_dir: prompts                  # provider=file 時的 prompt 目錄（gitignored，地端維護）
prompt_label: production             # 每次 review 開始時解析並固定成版本
evidence_embedding_enabled: false    # 開啟後每個 review 以單次 embedding 請求做混合檢索
evidence_lexical_weight: 0.7         # BM25-like 權重；其餘為 cosine embedding 權重
evidence_top_k: 4                    # 每個 F03 項目最多送入模型的佐證片段數
embedding_base_url: null             # 佐證檢索的 embeddings 端點；null = 沿用上面的 base_url
embedding_model: bge-m3              # embeddings 模型；api_key 走 GOVCHECK_EMBEDDING_API_KEY
embedding_timeout: 120               # embeddings 請求逾時（秒）

# 法規對照表（凍結的靜態資產；建置管線已封存於 _Archive/rag_build/）。
# 缺此區段時 load_regulations_config() 全用硬碼預設，行為一致。
# 環境變數可覆寫任一鍵：GOVCHECK_REGULATIONS_MAPPING_PATH / _MAX_SECTIONS_PER_ITEM / _MAX_EXCERPT_CHARS / _MAX_ITEMS
regulations:
  mapping_path: data/rag/retrieval_map.json  # 凍結產物（gitignored；runtime 只讀查表）
  max_sections_per_item: 3           # 每檢核項最多引用條文段數
  max_excerpt_chars: 300             # 每段摘錄字數上限（prompt 預算防護）
  max_items: 30                      # F02 觸發題查表引用上限（安全閥）
