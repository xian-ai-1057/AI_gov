enabled_formats:
  - .pdf
  - .docx
  - .xlsx
  - .txt
  - .csv
  - .tsv
  - .md
word_strategy: auto
model_host:
approved_model_hosts: [localhost, 127.0.0.1]
request_timeout: 60
max_file_bytes: 52428800
max_pages: 200
max_zip_uncompressed_bytes: 209715200
max_zip_ratio: 100
temp_root:
ocr_enabled: false
vlm_enabled: false
persistent_log_enabled: false

